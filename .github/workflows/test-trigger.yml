name: "Test Ready For Review Trigger"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: |
      (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    steps:
      - run: echo "ready_for_review event fired"
