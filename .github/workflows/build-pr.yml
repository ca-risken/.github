name: Build and Tag Container for PR

on:
  workflow_call:
    inputs:
      runs_on:
        description: 'Runner label or array of runner labels'
        required: true
        type: string
      install_go_version:
        description: 'Go version to install'
        required: false
        type: string
        default: '1.23.3'
      golangci_lint_version:
        description: 'Golangci-lint version'
        required: false
        type: string
        default: 'v1.62.0'
      image_prefix:
        description: 'Docker image prefix'
        required: true
        type: string
      aws_xray_sdk_disabled:
        description: 'Disable AWS X-Ray SDK'
        required: false
        type: string
        default: 'false'
    secrets:
      DOCKER_USER:
        description: 'Docker Hub username'
        required: true
      DOCKER_TOKEN:
        description: 'Docker Hub token'
        required: true
      DOCKER_REGISTRY:
        description: 'Docker registry URL'
        required: true

jobs:
  build:
    runs-on: ${{ inputs.runs_on }}
    env:
      IMAGE_PREFIX: ${{ inputs.image_prefix }}
      AWS_XRAY_SDK_DISABLED: ${{ inputs.aws_xray_sdk_disabled }}
      INSTALL_GO_VERSION: ${{ inputs.install_go_version }}
      GOLANGCI_LINT_VERSION: ${{ inputs.golangci_lint_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup environment
        run: |
          echo "SRC=${GITHUB_WORKSPACE}/src" >> $GITHUB_ENV
          echo "TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.INSTALL_GO_VERSION }}
  
      - uses: golangci/golangci-lint-action@v6
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
      
      - name: Lint and test
        run: |
          echo "Lint the sources..."
          make lint -k
          echo "Testing the sources..."
          make go-test -j

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}
      
      - name: Docker build and tag
        run: |
          echo "Build started on $(date)"
          make build-ci -j BUILD_OPT='--no-cache --pull' IMAGE_TAG=${TAG} IMAGE_PREFIX=${IMAGE_PREFIX} IMAGE_REGISTRY=${{ secrets.DOCKER_REGISTRY }}
